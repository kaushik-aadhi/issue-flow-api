spring:
  application:
    name: issueflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/issueflow}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:development-only-change-this-secret-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
